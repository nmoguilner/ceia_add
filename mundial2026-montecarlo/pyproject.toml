[project]
name = "mundial2026-montecarlo"
version = "0.1.0"
description = "Simulacion Monte Carlo del Mundial 2026 a partir del ELO y las tablas actuales"
requires-python = ">=3.11"
# El motor lee los datos en Parquet -> requiere pyarrow (no hay lector en stdlib).
dependencies = ["pyarrow>=14"]

[project.optional-dependencies]
# Solo para el notebook y los graficos (no para correr la simulacion):
#   uv sync --extra notebook
notebook = [
    "matplotlib>=3.8",
    "pandas>=2.1",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]
# Solo para el TP de Aprendizaje de Maquina (clasificador supervisado):
#   uv run --extra ml python train.py
ml = [
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "joblib>=1.3",
]

[tool.uv]
package = false
