[project]
name = "mundial2026-montecarlo"
version = "0.1.0"
description = "Simulacion Monte Carlo del Mundial 2026 a partir del ELO y las tablas actuales"
requires-python = ">=3.11"
dependencies = []  # el motor (wcsim.py / run.py) solo usa la biblioteca estandar

[project.optional-dependencies]
# Solo para el notebook y los graficos (no para correr la simulacion):
#   uv sync --extra notebook
notebook = [
    "matplotlib>=3.8",
    "pandas>=2.1",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]

[tool.uv]
package = false
