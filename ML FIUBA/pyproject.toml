[project]
name = "ml-fiuba"
version = "0.1.0"
description = "Trabajo final AdM - CEIA FIUBA: penalización por edad en ingreso y empleo (EPH)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "joblib",
    "pyyaml",
    "jupyter",
    "nbconvert",
    "ipykernel",
    "pyarrow>=24.0.0",
    "statsmodels>=0.14.6",
]

# Grupos opcionales: se instalan con `uv sync --group <nombre>`
[dependency-groups]
# Descarga de microdatos de la EPH (paso que corrés en tu máquina con internet)
data = ["pyeph"]
# Análisis de brechas / discriminación
fairness = ["fairlearn"]
gpu = [
    "mlx>=0.31.2",
]
interpret = [
    "llvmlite>=0.43",
    "numba>=0.60",
    "shap>=0.46",
]

[tool.uv]
# Es una aplicación (scripts), no una librería instalable: no se construye como paquete.
package = false
