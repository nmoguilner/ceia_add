[project]
name = "yellow-taxi-propina"
version = "0.1.0"
description = "TP grupal de Aprendizaje de Máquina (CEIA-FIUBA) — predicción de propina (tip_amount) en viajes de NYC Yellow Taxi."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Fioranelli, Rocío" },
    { name = "Lerner, Federico" },
    { name = "Makk, Azul" },
    { name = "Moguilner Reh, Nicolás", email = "nmoguilner@gmail.com" },
]
dependencies = [
    "pandas>=2.1.4,<2.2.0",
    "numpy>=1.26.4,<2.0.0",
    "scipy>=1.11.4,<1.12.0",
    "matplotlib>=3.7.5,<3.8.0",
    "seaborn>=0.13.2,<0.14.0",
    "scikit-learn>=1.4.2,<1.5.0",
    "pyarrow>=24.0.0,<25.0.0",
    "joblib>=1.3.2,<2.0.0",
    "ipykernel>=6.31.0",
    "jupyter>=1.1.1",
]

[tool.uv]
package = false
